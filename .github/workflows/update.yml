name: Update Note4 calendar

on:
  schedule:
    # Every 20 min from 05 to 21 UTC (06-22 in winter, 07-23 in summer in Spain).
    # GitHub delays or skips scheduled runs, so ask often.
    - cron: "*/20 5-21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Render page
        env:
          ICAL_URLS: ${{ secrets.ICAL_URLS }}
          PAGE_DIR: ${{ secrets.PAGE_DIR }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          CITY: ${{ vars.CITY }}
        run: |
          test -n "$PAGE_DIR"
          python render.py "site/$PAGE_DIR"
          touch site/.nojekyll
          printf '' > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Keep the schedule alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" || true
